name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.11

      - name: Lint (ruff, incl. secret/security checks)
        run: uv run ruff check .

      - name: Provenance gate (no unsourced number in data/**/*.yaml)
        run: uv run python -m pipeline.provenance

      - name: Run tests
        # No OPENROUTER_API_KEY in CI for this job: the Phase-0 prover and tests
        # exercise the offline illustrative-sample path. Real keys come from
        # repository secrets only in the Phase-5 data-refresh workflow.
        run: uv run pytest -q

  # The frontend had no pre-merge gate at all: `deploy` builds it, but deploy
  # only runs after the merge to main, so a type error or a failing vitest
  # reached main and broke publishing instead of failing the PR. That is how
  # #107 landed with an unused-variable type error and a mis-dated freshness
  # assertion. Same checks as deploy, run early enough to matter.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --run

      - name: Build (tsc -b && vite build)
        run: npm run build
