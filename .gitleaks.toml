title = "gitleaks config - llm-carbon-index"

[allowlist]
description = "Model metadata join keys (capability_key + slug values) are table keys for efficiency frontier / rightsizing (Phase 6M / 0.8.0), not credentials. Values in data/crosswalk/model_crosswalk.yaml and data/model_capability.yaml (provisional placeholders per docs). See PR #22 and CHANGELOG 0.8.0. Real secrets never committed here."
regexes = [
  '''(?i)capability_key''',
]
# Path exemptions. Every file under data/ and docs/, plus any path whose final
# component starts with CHANGELOG, is skipped by gitleaks. These trees hold bulk
# metadata and long documentation tables whose non-secret identifiers otherwise
# trigger false positives. Known risk: a real credential accidentally committed
# under one of these paths would not be reported. The rules above and below are
# deliberately unchanged; tightening them is a separate, user-approved decision.
# Run the pre-commit self-check in SECURITY.md before committing anything there.
paths = [
  '''(?i)(^|/)data/''',
  '''(?i)(^|/)docs/''',
  '''(?i)(^|/)CHANGELOG''',
]
